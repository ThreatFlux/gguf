name: Auto Release

# Key on the head repository too, so a fork pull request whose branch is named
# "main" cannot enter this repository's main release queue. Dry runs get their
# own group. Queue completions instead of cancelling an in-flight publication.
concurrency:
  group: auto-release-${{ github.event.workflow_run.head_repository.id || github.repository_id }}-${{ github.event.workflow_run.head_branch || github.ref_name }}${{ inputs.dry_run && '-dry' || '' }}
  cancel-in-progress: false
  queue: max

on:
  # workflow_run is needed to release only after CI and Security pass on main.
  # The release job below ignores every run that is not a successful push to
  # this repository's main, and the reusable workflow checks out and gates on
  # that exact commit, so no pull request code is ever executed here.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Report the next release without creating a commit, tag, GitHub Release or downstream run
        required: false
        default: false
        type: boolean

# Read-only by default; only the release job is granted write scopes.
permissions:
  contents: read

jobs:
  check-release-write:
    name: Check release write prerequisites
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require the automation App for release writes
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          HAS_APP_ID: ${{ vars.TF_AUTOMATION_APP_ID != '' }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ "$HAS_APP_ID" != true || "$HAS_APP_PRIVATE_KEY" != true ]]; then
            echo '::error::Configure TF_AUTOMATION_APP_ID and TF_AUTOMATION_APP_PRIVATE_KEY for reviewed release proposals.'
            exit 1
          fi
      - name: Checkout the workflow source
        if: ${{ github.event_name == 'workflow_run' || (github.ref == 'refs/heads/main' && !inputs.dry_run) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact release proposal provenance
        if: ${{ github.event_name == 'workflow_run' || (github.ref == 'refs/heads/main' && !inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/check_release_provenance.py "$GITHUB_REPOSITORY" "$TARGET_SHA"

  release:
    needs: check-release-write
    permissions:
      actions: write # Dispatches release.yml only when the GitHub App token is unavailable.
      contents: write # Release commit, annotated tag and GitHub Release.
      pull-requests: write # Required by the reusable workflow's release job.
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@f4d48290988681cfbf3e03f47e312a79b322ccc8  # v0.7.12
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      create-pr: true
      required-workflows: ci.yml,security.yml
      # The threatflux-automation App pushes the tag, which starts release.yml
      # through its `push: tags` trigger; the reusable workflow then skips this
      # dispatch and only uses it on the GITHUB_TOKEN fallback path.
      dispatch-workflows: release.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
