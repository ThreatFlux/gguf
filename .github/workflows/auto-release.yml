name: Auto Release

concurrency:
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["CI", "Security"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  actions: read
  contents: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@e9bec9898080aa55bec9f3ce4351bae37f8b88cd
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      required-workflows: ci.yml,security.yml
      dispatch-workflows: release.yml
      dispatch-version-workflow: release.yml
