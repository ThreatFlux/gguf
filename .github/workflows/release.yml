name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to verify or release, without the v prefix
        required: true
        type: string
      dry_run:
        description: Verify, build and package everything without publishing to crates.io or touching the GitHub Release
        required: false
        type: boolean
        default: false

# Read-only by default. Only the GitHub Release job gets contents: write and
# only the crates.io job gets id-token: write.
permissions:
  contents: read

concurrency:
  # A dry run gets its own group, so a rehearsal never queues behind (or
  # alongside) a real release of the same ref.
  group: release-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CRATE_NAME: gguf-rs-lib
  CLI_NAME: gguf-cli
  # Only workflow_dispatch can set this; tag pushes always perform a real release.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

jobs:
  verify-package:
    name: Verify Release Package
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      tag_object: ${{ steps.provenance.outputs.tag_object }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every later job checks out this exact commit, so a moving branch
      # cannot make the binaries, SBOMs or crate differ from what was verified.
      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse --verify HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.99.0

      - name: Verify active compiler
        run: rustc --version --verbose

      - name: Verify release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          METADATA=$(cargo metadata --locked --no-deps --format-version 1)
          LIB_VERSION=$(jq -er --arg name "$CRATE_NAME" '.packages[] | select(.name == $name) | .version' <<< "$METADATA")
          CLI_VERSION=$(jq -er --arg name "$CLI_NAME" '.packages[] | select(.name == $name) | .version' <<< "$METADATA")

          if ! jq -e --arg name "$CLI_NAME" '.packages[] | select(.name == $name) | .publish == []' \
            <<< "$METADATA" >/dev/null; then
            echo "$CLI_NAME must remain publish = false" >&2
            exit 1
          fi
          if [[ "$LIB_VERSION" != "$CLI_VERSION" ]]; then
            echo "Workspace versions differ: $CRATE_NAME=$LIB_VERSION, $CLI_NAME=$CLI_VERSION" >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" && "$LIB_VERSION" != "$REQUESTED_VERSION" ]]; then
            # A dry run may rehearse a version that is not bumped yet, so it
            # only warns; it packages and verifies the manifest version.
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "::warning::Package version $LIB_VERSION does not match requested version $REQUESTED_VERSION; the dry run verifies $LIB_VERSION"
            else
              echo "Package version $LIB_VERSION does not match requested version $REQUESTED_VERSION" >&2
              exit 1
            fi
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            EXPECTED_TAG="v${LIB_VERSION}"
            if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
              echo "Release tag must be exactly $EXPECTED_TAG, got $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi
          echo "version=$LIB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release provenance
        id: provenance
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --no-tags origin main
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$TAG_REF")" != "tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME must be annotated" >&2
            exit 1
          fi
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release commit $TAG_COMMIT is not reachable from origin/main" >&2
            exit 1
          fi
          echo "tag_object=$(git rev-parse "$TAG_REF")" >> "$GITHUB_OUTPUT"

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

      - name: Check library package contents
        run: bash scripts/check_package.sh

      - name: Verify library package
        run: cargo package --locked -p gguf-rs-lib

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo "### Release dry run: v${VERSION}"
            echo
            echo "Source commit: \`${SOURCE_SHA}\`."
            echo
            echo "Builds every gguf-cli target, generates the SBOMs and runs \`cargo publish --dry-run\` for ${CRATE_NAME}."
            echo "Nothing is published to crates.io and no tag, GitHub Release or release asset is created or changed."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build gguf-cli (${{ matrix.target }})
    needs: verify-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-musl-amd64
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: gguf-cli-v${{ needs.verify-package.outputs.version }}-${{ matrix.artifact }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-package.outputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build gguf-cli
        shell: bash
        run: cargo build --locked --release --target "$TARGET" -p gguf-cli --bin gguf-cli

      # Every target runs natively on its runner, so each binary is executed
      # before it is packaged.
      - name: Smoke test gguf-cli
        shell: bash
        run: |
          BINARY="target/${TARGET}/release/gguf-cli"
          [[ "$RUNNER_OS" == "Windows" ]] && BINARY="${BINARY}.exe"
          "$BINARY" --version
          "$BINARY" --help > /dev/null

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/${ARCHIVE}"
          cp "target/${TARGET}/release/gguf-cli" LICENSE README.md "dist/${ARCHIVE}/"
          tar -C dist -czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/${env:ARCHIVE}" | Out-Null
          Copy-Item "target/${env:TARGET}/release/gguf-cli.exe", LICENSE, README.md "dist/${env:ARCHIVE}/"
          $archive = "${env:ARCHIVE}.zip"
          Compress-Archive -Path "dist/${env:ARCHIVE}" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error
          retention-days: 5

  sbom:
    name: Generate Release SBOMs
    needs: verify-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-package.outputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.99.0

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-cyclonedx@0.5.9

      # cargo-cyclonedx writes one CycloneDX document per workspace package
      # next to its manifest: the published library and the CLI binary.
      - name: Generate SBOM files
        env:
          VERSION: ${{ needs.verify-package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --all-features --format json --spec-version 1.5 --override-filename sbom
          mkdir -p sbom-dist
          mv sbom.json "sbom-dist/gguf-rs-lib-v${VERSION}.cdx.json"
          mv gguf-cli/sbom.json "sbom-dist/gguf-cli-v${VERSION}.cdx.json"
          for package in gguf-rs-lib gguf-cli; do
            jq -e --arg name "$package" --arg version "$VERSION" \
              '.bomFormat == "CycloneDX" and .metadata.component.name == $name and .metadata.component.version == $version' \
              "sbom-dist/${package}-v${VERSION}.cdx.json" > /dev/null
          done
          ls -l sbom-dist

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: sbom-dist/*.cdx.json
          if-no-files-found: error
          retention-days: 5

  publish-crate:
    name: Publish gguf-rs-lib
    # Real publishes happen only for a tag ref; a dry run on any ref runs
    # `cargo publish --dry-run`. A real dispatch on a branch verifies only.
    if: (github.event_name == 'workflow_dispatch' && inputs.dry_run) || startsWith(github.ref, 'refs/tags/')
    needs:
      - verify-package
      - build
      - sbom
    runs-on: ubuntu-latest
    # crates.io trusted publishing trusts this workflow file (release.yml) in
    # the crates-io environment. A dry run gets an empty environment name, so
    # it runs without an environment and records no deployment.
    environment:
      name: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'crates-io' || '' }}
    permissions:
      contents: read
      id-token: write # Exchanged for a short-lived crates.io token; no registry secret is used.
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-package.outputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.99.0

      - name: Verify active compiler
        run: rustc --version --verbose

      - name: Recheck immutable release tag
        if: env.DRY_RUN != 'true'
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.verify-package.outputs.tag_object }}
        shell: bash
        run: |
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          REMOTE_TAG_OBJECT=$(git ls-remote --tags origin "$TAG_REF" | awk 'NR == 1 { print $1 }')
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$REMOTE_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag $GITHUB_REF_NAME changed or disappeared after verification" >&2
            exit 1
          fi

      - name: Verify crates.io publication (dry run)
        if: env.DRY_RUN == 'true'
        run: cargo publish --locked -p gguf-rs-lib --dry-run

      # crates.io versions are immutable, so a rerun (or a second run for the
      # same tag) skips a version that is already published instead of failing.
      - name: Check whether the version is already published
        id: pending
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ needs.verify-package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --user-agent "${GITHUB_REPOSITORY}-release/${GITHUB_RUN_ID} (https://github.com/${GITHUB_REPOSITORY})" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${VERSION}")
          case "$STATUS" in
            200)
              echo "::notice::${CRATE_NAME} ${VERSION} is already on crates.io; skipping the upload"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "crates.io returned HTTP ${STATUS} for ${CRATE_NAME} ${VERSION}" >&2
              exit 1
              ;;
          esac

      - name: Authenticate with crates.io
        id: crates-io-auth
        if: env.DRY_RUN != 'true' && steps.pending.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: env.DRY_RUN != 'true' && steps.pending.outputs.publish == 'true'
        env:
          # Short-lived trusted-publishing token; the auth action revokes it in
          # its post step. No long-lived registry secret is read.
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked -p gguf-rs-lib

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    needs:
      - verify-package
      - build
      - sbom
      - publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: write # Creates or updates the GitHub Release and uploads its assets.
    steps:
      - name: Recheck immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify-package.outputs.tag_object }}
        shell: bash
        run: |
          REMOTE_TAG_OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.sha)
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$REMOTE_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag $GITHUB_REF_NAME changed or disappeared after publication" >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      # The auto-release workflow creates the GitHub Release together with the
      # tag; a manually pushed tag has none yet, so create it here.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            PRERELEASE=()
            [[ "$TAG" == *-* ]] && PRERELEASE=(--prerelease)
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "GGUF ${TAG}" --generate-notes "${PRERELEASE[@]}"
          fi
          shopt -s nullglob
          ASSETS=(artifacts/*)
          if (( ${#ASSETS[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          # Assets of a released version are immutable: a re-run keeps every
          # asset that is already attached and uploads only the missing ones.
          # An archive and its checksum are kept or uploaded together.
          declare -A ATTACHED=()
          while IFS= read -r name; do
            [[ -n "$name" ]] && ATTACHED["$name"]=1
          done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          UPLOAD=()
          for asset in "${ASSETS[@]}"; do
            name="$(basename "$asset")"
            [[ "$name" == *.sha256 ]] && continue
            checksum=""
            [[ -f "${asset}.sha256" ]] && checksum="${asset}.sha256"
            checksum_attached=""
            [[ -n "$checksum" && -n "${ATTACHED["${name}.sha256"]:-}" ]] && checksum_attached=1
            if [[ -n "${ATTACHED["$name"]:-}" ]]; then
              if [[ -n "$checksum" && -z "$checksum_attached" ]]; then
                echo "$name is attached to $TAG without ${name}.sha256; repair the release assets by hand" >&2
                exit 1
              fi
              echo "::notice::$name is already attached to $TAG; keeping the published asset"
              continue
            fi
            if [[ -n "$checksum_attached" ]]; then
              echo "${name}.sha256 is attached to $TAG without $name; repair the release assets by hand" >&2
              exit 1
            fi
            UPLOAD+=("$asset")
            [[ -n "$checksum" ]] && UPLOAD+=("$checksum")
          done
          if (( ${#UPLOAD[@]} == 0 )); then
            echo "Every release asset is already attached to $TAG"
            exit 0
          fi
          gh release upload "$TAG" "${UPLOAD[@]}" --repo "$GITHUB_REPOSITORY"
