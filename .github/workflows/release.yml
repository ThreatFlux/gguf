name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to verify or release, without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-package:
    name: Verify Release Package
    runs-on: ubuntu-latest
    outputs:
      tag_object: ${{ steps.provenance.outputs.tag_object }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-1.97.1-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          METADATA=$(cargo metadata --locked --no-deps --format-version 1)
          LIB_VERSION=$(jq -er '.packages[] | select(.name == "gguf-rs-lib") | .version' <<< "$METADATA")
          CLI_VERSION=$(jq -er '.packages[] | select(.name == "gguf-cli") | .version' <<< "$METADATA")

          if ! jq -e '.packages[] | select(.name == "gguf-cli") | .publish == []' \
            <<< "$METADATA" >/dev/null; then
            echo "gguf-cli must remain publish = false" >&2
            exit 1
          fi
          if [[ "$LIB_VERSION" != "$CLI_VERSION" ]]; then
            echo "Workspace versions differ: gguf-rs-lib=$LIB_VERSION, gguf-cli=$CLI_VERSION" >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" && "$LIB_VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "Package version $LIB_VERSION does not match requested version $REQUESTED_VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            EXPECTED_TAG="v${LIB_VERSION}"
            if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
              echo "Release tag must be exactly $EXPECTED_TAG, got $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi
          echo "version=$LIB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release provenance
        id: provenance
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --no-tags origin main
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$TAG_REF")" != "tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME must be annotated" >&2
            exit 1
          fi
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release commit $TAG_COMMIT is not reachable from origin/main" >&2
            exit 1
          fi
          echo "tag_object=$(git rev-parse "$TAG_REF")" >> "$GITHUB_OUTPUT"

      - name: Verify version is unpublished
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          CRATE_DATA=$(curl --fail --silent --show-error --retry 3 \
            --user-agent "ThreatFlux-gguf-release/${GITHUB_RUN_ID}" \
            https://crates.io/api/v1/crates/gguf-rs-lib)
          if jq -e --arg version "$PACKAGE_VERSION" \
            '.versions | any(.num == $version)' <<< "$CRATE_DATA" >/dev/null; then
            echo "gguf-rs-lib $PACKAGE_VERSION is already published on crates.io" >&2
            exit 1
          fi

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

      - name: Check library package contents
        run: bash scripts/check_package.sh

      - name: Verify library package
        run: cargo package --locked -p gguf-rs-lib

      - name: Verify crates.io publication
        run: cargo publish --locked -p gguf-rs-lib --dry-run

  publish-crate:
    name: Publish gguf-rs-lib
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
      url: https://crates.io/crates/gguf-rs-lib
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-publish-1.97.1-${{ hashFiles('**/Cargo.lock') }}

      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.verify-package.outputs.tag_object }}
        shell: bash
        run: |
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          REMOTE_TAG_OBJECT=$(git ls-remote --tags origin "$TAG_REF" | awk 'NR == 1 { print $1 }')
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$REMOTE_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag $GITHUB_REF_NAME changed or disappeared after verification" >&2
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "Required crates.io registry credential is unavailable" >&2
            exit 1
          fi
          cargo publish --locked -p gguf-rs-lib

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - verify-package
      - publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.verify-package.outputs.tag_object }}
        shell: bash
        run: |
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          REMOTE_TAG_OBJECT=$(git ls-remote --tags origin "$TAG_REF" | awk 'NR == 1 { print $1 }')
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$REMOTE_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag $GITHUB_REF_NAME changed or disappeared after publication" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: GGUF ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
