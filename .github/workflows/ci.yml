name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; every main commit keeps its own
# result, because Auto Release waits on it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  quality:
    name: Quality (Rust 1.99.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Verify active compiler
        run: rustc --version --verbose

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.99.0-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features --verbose

      - name: Test library documentation
        run: cargo test --locked -p gguf-rs-lib --doc --all-features

      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build examples
        run: cargo build --locked --workspace --examples --all-features

      - name: Check documentation contracts
        run: python3 scripts/check_docs.py

      - name: Check package contents
        run: bash scripts/check_package.sh

      - name: Verify library package
        run: cargo package --locked -p gguf-rs-lib

  feature-sets:
    name: Feature Sets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.99.0

      - name: Verify active compiler
        run: rustc --version --verbose

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-1.99.0-${{ hashFiles('**/Cargo.lock') }}

      - name: Check default library features
        run: cargo check --locked -p gguf-rs-lib --all-targets

      - name: Check alloc-only library
        run: cargo check --locked -p gguf-rs-lib --lib --no-default-features --features alloc

      - name: Test alloc-only public API
        run: cargo test --locked -p gguf-rs-lib --no-default-features --features alloc --test alloc_only

      - name: Check async library
        run: cargo check --locked -p gguf-rs-lib --lib --no-default-features --features async

      - name: Check memory-mapped library
        run: cargo check --locked -p gguf-rs-lib --lib --no-default-features --features mmap

      - name: Check all library features
        run: cargo check --locked -p gguf-rs-lib --all-targets --all-features

      - name: Check minimal CLI
        run: cargo check --locked -p gguf-cli --no-default-features

      - name: Check all CLI features
        run: cargo check --locked -p gguf-cli --all-features

  msrv:
    name: Minimum Supported Rust (1.87.0)
    env:
      RUSTUP_TOOLCHAIN: 1.87.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.87.0

      - name: Verify active compiler
        run: rustc --version --verbose

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-1.87.0-${{ hashFiles('**/Cargo.lock') }}

      - name: Check workspace at MSRV
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Test alloc-only public API at MSRV
        run: cargo test --locked -p gguf-rs-lib --no-default-features --features alloc --test alloc_only

  compatibility:
    name: Compatibility (${{ matrix.os }}, Rust ${{ matrix.rust }})
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust: 1.99.0
            experimental: false
          - os: macos-latest
            rust: 1.99.0
            experimental: false
          - os: ubuntu-latest
            rust: beta
            experimental: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Verify active compiler
        run: rustc --version --verbose

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload; no CODECOV_TOKEN secret is used.
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview

      - name: Verify active compiler
        run: rustc --version --verbose

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Generate coverage
        shell: bash
        run: |
          cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
          test -s lcov.info
          grep -q '^SF:' lcov.info

      - name: Retain required coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.1
          files: lcov.info
          fail_ci_if_error: true
