name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  quality:
    name: Quality (Rust 1.97.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.97.1-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features --verbose

      - name: Test library documentation
        run: cargo test --locked -p gguf-rs-lib --doc --all-features

      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build examples
        run: cargo build --locked --workspace --examples --all-features

      - name: Check documentation contracts
        run: python3 scripts/check_docs.py

      - name: Check package contents
        run: bash scripts/check_package.sh

      - name: Verify library package
        run: cargo package --locked -p gguf-rs-lib

  feature-sets:
    name: Feature Sets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-1.97.1-${{ hashFiles('**/Cargo.lock') }}

      - name: Check default library features
        run: cargo check --locked -p gguf-rs-lib --all-targets

      - name: Check alloc-only library
        run: cargo check --locked -p gguf-rs-lib --lib --no-default-features --features alloc

      - name: Test alloc-only public API
        run: cargo test --locked -p gguf-rs-lib --no-default-features --features alloc --test alloc_only

      - name: Check async library
        run: cargo check --locked -p gguf-rs-lib --lib --no-default-features --features async

      - name: Check memory-mapped library
        run: cargo check --locked -p gguf-rs-lib --lib --no-default-features --features mmap

      - name: Check all library features
        run: cargo check --locked -p gguf-rs-lib --all-targets --all-features

      - name: Check minimal CLI
        run: cargo check --locked -p gguf-cli --no-default-features

      - name: Check all CLI features
        run: cargo check --locked -p gguf-cli --all-features

  msrv:
    name: Minimum Supported Rust (1.87.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.87.0

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-1.87.0-${{ hashFiles('**/Cargo.lock') }}

      - name: Check workspace at MSRV
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Test alloc-only public API at MSRV
        run: cargo test --locked -p gguf-rs-lib --no-default-features --features alloc --test alloc_only

  compatibility:
    name: Compatibility (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust: 1.97.1
            experimental: false
          - os: macos-latest
            rust: 1.97.1
            experimental: false
          - os: ubuntu-latest
            rust: beta
            experimental: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

  coverage:
    name: Code Coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Generate coverage
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          version: v11.3.1
          files: lcov.info
          fail_ci_if_error: true
