version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: "0 5 * * *"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      rust-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "30 5 * * *"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
