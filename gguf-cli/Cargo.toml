[package]
name = "gguf-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
description = "Command-line tool for working with GGUF (GGML Universal Format) files"
authors = ["ThreatFlux", "Wyatt Roersma"]
license = "MIT"
repository = "https://github.com/ThreatFlux/gguf"
homepage = "https://github.com/ThreatFlux/gguf"
readme = "../README.md"
publish = false
keywords = ["gguf", "ggml", "machine-learning", "cli", "format"]
categories = ["command-line-utilities", "parsing"]

[[bin]]
name = "gguf-cli"
path = "src/main.rs"

[dependencies]
# Core GGUF library
gguf-rs-lib = { path = "..", features = ["std"] }

# CLI framework
clap = { version = "4.6", features = ["derive", "color"] }

# Error handling
anyhow = "1.0"

# Serialization for output formats
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "1.1"

# Terminal and output formatting
colored = { version = "3.1", optional = true }

# File I/O and path handling
walkdir = "2.5"

[features]
default = ["color"]
color = ["dep:colored"]

[dev-dependencies]
tempfile = "3.27"
assert_cmd = "2.0"
predicates = "3.0"
