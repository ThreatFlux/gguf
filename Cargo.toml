[workspace]
members = [
    ".",
    "gguf-cli",
]
resolver = "2"

[package]
name = "gguf-rs-lib"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
description = "A Rust library for reading and writing GGUF (GGML Universal Format) files"
authors = ["ThreatFlux", "Wyatt Roersma"]
license = "MIT"
repository = "https://github.com/ThreatFlux/gguf"
homepage = "https://github.com/ThreatFlux/gguf"
documentation = "https://docs.rs/gguf-rs-lib"
readme = "README.md"
include = ["/src/**", "/tests/**", "/benches/**", "/examples/**", "/docs/**", "/README.md", "/CHANGELOG.md", "/SECURITY.md", "/LICENSE"]
keywords = ["gguf", "ggml", "machine-learning", "format", "parser"]
categories = ["parsing", "data-structures", "science"]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"], default-features = false, optional = true }
thiserror = { version = "2.0", default-features = false, optional = true }

# Core no_std support
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"], optional = true }
libm = { version = "0.2", optional = true }

# Optional dependencies for additional functionality
tokio = { version = "1.0", features = ["io-util", "fs", "macros", "rt-multi-thread"], optional = true }
memmap2 = { version = "0.9", optional = true }

[features]
default = ["std"]
std = ["serde/std", "thiserror", "alloc"]
# Core allocation support - essentially required for any meaningful functionality
alloc = ["hashbrown", "libm", "serde?/alloc"]
async = ["dep:tokio", "std"]
mmap = ["dep:memmap2", "std"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.27"
proptest = "1.9"

[[bench]]
name = "gguf_benchmarks"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
